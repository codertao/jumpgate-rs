[package]
name = "jumpgate-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire layouts and extract loaders shared by jumpgate-server and jumpgate-agent."

[lib]
name = "jumpgate_common"
