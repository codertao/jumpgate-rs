[package]
name = "jumpgate-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone preservation fan server for the stock Jumpgate client (own machine / consenting testers only)."

[[bin]]
name = "jumpgate-server"
path = "src/main.rs"

[dependencies]
raknet = { path = "../raknet", features = ["mitm"] }
jumpgate-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
